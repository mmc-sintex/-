<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🏚️ کلونی سه‌بعدی</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap');
:root {
  --bg:#0a0e14; --panel:rgba(19,24,32,.95); --panel2:#1a2330;
  --border:#2a3441; --text:#e6edf3; --muted:#8b949e;
  --green:#3fb950; --blue:#58a6ff; --red:#f85149;
  --yellow:#d29922; --purple:#bc8cff; --orange:#f0883e;
}
body {
  font-family:'Vazirmatn',sans-serif;
  background:var(--bg); color:var(--text);
  overflow:hidden; height:100vh; touch-action:manipulation;
  -webkit-user-select:none; user-select:none;
}
#threeContainer { position:fixed; inset:0; z-index:0; }

#mainMenu {
  position:fixed; inset:0; background:rgba(0,0,0,.95); z-index:200;
  display:flex; align-items:center; justify-content:center; flex-direction:column; gap:20px;
  animation:fadeIn .5s ease;
}
#mainMenu.hidden { display:none; }
#mainMenu h1 { font-size:2.5rem; color:var(--yellow); text-shadow:0 0 30px rgba(210,153,34,.3); }
#mainMenu .subtitle { color:var(--muted); font-size:.9rem; }
#mainMenu .menu-buttons { display:flex; gap:15px; flex-wrap:wrap; justify-content:center; }
#mainMenu .menu-btn {
  background:var(--panel2); border:2px solid var(--border); color:var(--text);
  padding:15px 30px; border-radius:10px; cursor:pointer; font-family:inherit;
  font-size:1rem; font-weight:700; transition:all .3s; min-width:180px;
  -webkit-tap-highlight-color:transparent;
}
#mainMenu .menu-btn:hover { border-color:var(--yellow); transform:translateY(-3px); }
#mainMenu .menu-btn:active { transform:scale(.95); }
#mainMenu .menu-btn.single { border-color:var(--blue); }
#mainMenu .menu-btn.single:hover { background:var(--blue); color:#000; }
#mainMenu .menu-btn.multi { border-color:var(--purple); }
#mainMenu .menu-btn.multi:hover { background:var(--purple); color:#000; }

#seedScreen {
  position:fixed; inset:0; background:rgba(0,0,0,.95); z-index:150;
  display:flex; align-items:center; justify-content:center; flex-direction:column; gap:15px;
}
#seedScreen.hidden { display:none; }
#seedScreen h1 { color:var(--yellow); font-size:1.5rem; }
#seedScreen input {
  background:var(--panel2); border:2px solid var(--border); color:var(--text);
  padding:10px 15px; border-radius:8px; font-size:1rem; text-align:center;
  font-family:inherit; width:200px;
}
#seedScreen .seed-buttons { display:flex; gap:10px; }
#seedScreen button {
  background:var(--green); color:#000; border:none; padding:12px 25px;
  border-radius:8px; font-size:.9rem; font-weight:900; cursor:pointer; font-family:inherit;
}
#seedScreen button.random { background:var(--blue); }
#seedScreen button.back { background:var(--panel2); color:var(--text); border:1px solid var(--border); }

#comingSoon {
  position:fixed; inset:0; background:rgba(0,0,0,.95); z-index:150;
  display:flex; align-items:center; justify-content:center; flex-direction:column; gap:15px;
}
#comingSoon.hidden { display:none; }
#comingSoon h1 { font-size:3rem; color:var(--purple); }
#comingSoon p { color:var(--muted); font-size:1rem; }
#comingSoon button {
  background:var(--panel2); border:1px solid var(--border); color:var(--text);
  padding:12px 25px; border-radius:8px; cursor:pointer; font-family:inherit; font-size:.9rem;
}

#uiOverlay {
  position:fixed; inset:0; z-index:10; pointer-events:none;
  display:flex; flex-direction:column; justify-content:space-between;
}
#uiOverlay > * { pointer-events:auto; }

header {
  background:var(--panel); backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  padding:6px 10px; display:flex; justify-content:space-between; align-items:center;
}
header h1 { font-size:.9rem; color:var(--yellow); }
#turnInfo { color:var(--muted); font-size:.65rem; }
#turnInfo b { color:var(--blue); }

#resources {
  display:flex; gap:4px; padding:4px 8px;
  background:var(--panel); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border); overflow-x:auto;
  -webkit-overflow-scrolling:touch;
}
.res-card {
  display:flex; align-items:center; gap:4px;
  background:var(--panel2); border:1px solid var(--border); border-radius:5px;
  padding:3px 8px; white-space:nowrap; font-size:.65rem; flex-shrink:0;
}
.res-card .icon { font-size:.85rem; }
.res-card .value { font-weight:900; font-size:.75rem; }

#bottomPanel {
  display:flex; gap:4px; padding:6px 8px;
  background:var(--panel); backdrop-filter:blur(12px);
  border-top:1px solid var(--border); overflow-x:auto;
  -webkit-overflow-scrolling:touch;
}
#bottomPanel button {
  background:var(--panel2); border:1px solid var(--border); color:var(--text);
  padding:8px 12px; border-radius:6px; cursor:pointer; font-family:inherit;
  font-size:.75rem; white-space:nowrap; flex-shrink:0;
  -webkit-tap-highlight-color:transparent;
}
#bottomPanel button:active { transform:scale(.95); }
#bottomPanel button.primary { background:var(--green); color:#000; font-weight:700; }

#logPanel {
  position:fixed; left:8px; bottom:60px; width:200px;
  max-height:120px; overflow-y:auto; z-index:20;
  background:var(--panel); backdrop-filter:blur(8px);
  border:1px solid var(--border); border-radius:6px; padding:4px;
  -webkit-overflow-scrolling:touch;
}
.log-entry { padding:2px 4px; font-size:.6rem; color:var(--muted); border-bottom:1px solid var(--border); }
.log-entry.good { color:var(--green); }
.log-entry.bad { color:var(--red); }
.log-entry.info { color:var(--blue); }

::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
</style>
</head>
<body>
<div id="threeContainer"></div>

<div id="mainMenu">
  <h1>🏚️ کلونی پسا-آخرالزمانی</h1>
  <p class="subtitle">در دنیای محدود، کلونی خود را بسازید، زامبی‌ها را نابود کنید و بر همه چیره شوید</p>
  <div class="menu-buttons">
    <button class="menu-btn single" onclick="openSeedScreen()">🎮 سینگل پلیر</button>
    <button class="menu-btn multi" onclick="showComingSoon()">🌐 مولتی پلیر</button>
  </div>
</div>

<div id="comingSoon" class="hidden">
  <h1>🚧</h1>
  <h1>Coming Soon</h1>
  <p>حالت مولتی پلیر به زودی اضافه خواهد شد!</p>
  <button onclick="closeComingSoon()">برگشت</button>
</div>

<div id="seedScreen" class="hidden">
  <h1>🌍 ایجاد دنیای جدید</h1>
  <p style="color:var(--muted);">سید دنیای خود را وارد کنید یا تصادفی انتخاب کنید:</p>
  <input type="text" id="seedInput" placeholder="مثال: 12345" value="12345">
  <div class="seed-buttons">
    <button class="random" onclick="randomSeed()">🎲 تصادفی</button>
    <button onclick="startGame()">شروع بازی</button>
    <button class="back" onclick="closeSeedScreen()">برگشت</button>
  </div>
</div>

<div id="uiOverlay" class="hidden">
  <header>
    <h1>🏚️ کلونی سه‌عدی</h1>
    <div id="turnInfo">نوبت <b id="turnNum">۱</b></div>
  </header>
  <div id="resources"></div>
  <div id="bottomPanel">
    <button onclick="addBuilding('farm', Math.random()*4-2, Math.random()*4-2)">🌾 مزرعه</button>
    <button onclick="addBuilding('well', Math.random()*4-2, Math.random()*4-2)">️ چاه</button>
    <button onclick="addBuilding('wall', Math.random()*4-2, Math.random()*4-2)">🧱 دیوار</button>
    <button onclick="addBuilding('warehouse', Math.random()*4-2, Math.random()*4-2)">📦 انبار</button>
    <button onclick="addBuilding('shelter', Math.random()*4-2, Math.random()*4-2)">🏠 پناهگاه</button>
    <button onclick="addBuilding('workshop', Math.random()*4-2, Math.random()*4-2)">⚙️ کارگاه</button>
    <button id="endTurn" class="primary">️ پایان نوبت</button>
  </div>
</div>

<div id="logPanel"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
// =============================================================
//   کلونی سه‌عدی - نسخه لمسی
// =============================================================

// توابع منو
function showComingSoon() {
  document.getElementById('comingSoon').classList.remove('hidden');
}
function closeComingSoon() {
  document.getElementById('comingSoon').classList.add('hidden');
}
function openSeedScreen() {
  document.getElementById('mainMenu').classList.add('hidden');
  document.getElementById('seedScreen').classList.remove('hidden');
}
function closeSeedScreen() {
  document.getElementById('seedScreen').classList.add('hidden');
  document.getElementById('mainMenu').classList.remove('hidden');
}
function randomSeed() {
  document.getElementById('seedInput').value = Math.floor(Math.random() * 99999);
}

// سید
function seededRandom(seed) {
  let s = seed;
  return function() {
    s = (s * 16807 + 0) % 2147483647;
    return (s - 1) / 2147483646;
  };
}

// وضعیت بازی
let state = {
  turn: 1,
  resources: { food: 100, water: 100, scrap: 80, wood: 60, knowledge: 15 },
  population: 10,
  log: []
};

let buildings = [];
let buildingMeshes = new Map();
let scene, camera, renderer, controls;
let clock = new THREE.Clock();
let worldSeed = 12345;

function addLog(msg, type='info') {
  state.log.unshift({msg, type});
  if (state.log.length > 30) state.log.pop();
  renderLog();
}

function renderLog() {
  document.getElementById('logPanel').innerHTML = state.log.map(l =>
    `<div class="log-entry ${l.type}">${l.msg}</div>`
  ).join('');
}

function renderResources() {
  const res = state.resources;
  const cards = [
    {icon:'🍞', name:'غذا', value:Math.floor(res.food)},
    {icon:'💧', name:'آب', value:Math.floor(res.water)},
    {icon:'🔩', name:'ضایعات', value:Math.floor(res.scrap)},
    {icon:'🪵', name:'چوب', value:Math.floor(res.wood)},
    {icon:'📚', name:'دانش', value:Math.floor(res.knowledge)},
    {icon:'👥', name:'جمعیت', value:state.population}
  ];
  document.getElementById('resources').innerHTML = cards.map(c => `
    <div class="res-card">
      <span class="icon">${c.icon}</span>
      <span class="value">${c.value}</span>
    </div>
  `).join('');
  document.getElementById('turnNum').textContent = state.turn;
}

// ساختمان‌ها
const BUILDING_TYPES = {
  castle: { name:'قلعه', icon:'🏰', size:2, color:0x8B4513, cost:{scrap:60, wood:80} },
  wall: { name:'دیوار', icon:'🧱', size:1, color:0x696969, cost:{scrap:5, wood:2} },
  farm: { name:'مزرعه', icon:'🌾', size:2, color:0x228B22, cost:{scrap:15, wood:25} },
  well: { name:'چاه آب', icon:'🕳️', size:1, color:0x4682B4, cost:{scrap:20, wood:10} },
  warehouse: { name:'انبار', icon:'📦', size:2, color:0xDEB887, cost:{scrap:30, wood:40} },
  workshop: { name:'کارگاه', icon:'⚙️', size:1, color:0x808080, cost:{scrap:50, wood:30} },
  shelter: { name:'پناهگاه', icon:'🏠', size:2, color:0xA0522D, cost:{scrap:30, wood:40} }
};

function createBuildingMesh(type) {
  const group = new THREE.Group();
  const def = BUILDING_TYPES[type];
  const size = def.size;
  
  const bodyGeo = new THREE.BoxGeometry(size * 0.8, 0.4, size * 0.8);
  const bodyMat = new THREE.MeshStandardMaterial({ color: def.color, roughness: 0.6, metalness: 0.3 });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.position.y = 0.2;
  body.castShadow = true;
  body.receiveShadow = true;
  group.add(body);
  
  const roofGeo = new THREE.ConeGeometry(size * 0.5, 0.3, 4);
  const roofMat = new THREE.MeshStandardMaterial({ color: 0x8B0000, roughness: 0.7 });
  const roof = new THREE.Mesh(roofGeo, roofMat);
  roof.position.y = 0.5;
  roof.rotation.y = Math.PI / 4;
  group.add(roof);
  
  return group;
}

function addBuilding(type, x, z) {
  const def = BUILDING_TYPES[type];
  if (!def) return;
  
  if (state.resources.scrap < def.cost.scrap || state.resources.wood < def.cost.wood) {
    addLog(`⚠️ منابع کافی برای ${def.name} نیست!`, 'bad');
    return;
  }
  
  state.resources.scrap -= def.cost.scrap;
  state.resources.wood -= def.cost.wood;
  
  const b = { id: Date.now() + Math.random(), type, x, z, mesh: null };
  buildings.push(b);
  
  const mesh = createBuildingMesh(type);
  mesh.position.set(x, 0, z);
  scene.add(mesh);
  b.mesh = mesh;
  buildingMeshes.set(b.id, mesh);
  
  addLog(`🔨 ${def.name} ساخته شد!`, 'good');
  renderResources();
}

// سه‌عدی
function initThree() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0e14);
  scene.fog = new THREE.FogExp2(0x0a0e14, 0.012);
  
  camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(15, 12, 15);
  camera.lookAt(0, 0, 0);
  
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  document.getElementById('threeContainer').appendChild(renderer.domElement);
  
  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.maxPolarAngle = Math.PI / 2.1;
  controls.minDistance = 3;
  controls.maxDistance = 50;
  
  const ambientLight = new THREE.AmbientLight(0x404060, 0.4);
  scene.add(ambientLight);
  
  const dirLight = new THREE.DirectionalLight(0xffeedd, 1.2);
  dirLight.position.set(10, 20, 5);
  dirLight.castShadow = true;
  scene.add(dirLight);
  
  const fillLight = new THREE.DirectionalLight(0x4488ff, 0.3);
  fillLight.position.set(-10, 5, -10);
  scene.add(fillLight);
  
  const hemiLight = new THREE.HemisphereLight(0x87ceeb, 0x362d1e, 0.6);
  scene.add(hemiLight);
  
  // زمین
  const groundGeo = new THREE.PlaneGeometry(60, 60, 20, 20);
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x1a2330, roughness: 0.9, flatShading: true });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.2;
  ground.receiveShadow = true;
  scene.add(ground);
  
  const gridHelper = new THREE.GridHelper(40, 20, 0x2a3441, 0x1a2330);
  gridHelper.position.y = 0.01;
  scene.add(gridHelper);
}

// پردازش نوبت
function processTurn() {
  const res = state.resources;
  
  // مصرف
  res.food -= state.population * 1;
  res.water -= state.population * 1;
  
  // تولید
  buildings.forEach(b => {
    const prod = { farm: { food:5 }, well: { water:5 }, workshop: { scrap:3 } }[b.type] || {};
    if (prod.food) res.food += prod.food;
    if (prod.water) res.water += prod.water;
    if (prod.scrap) res.scrap += prod.scrap;
  });
  
  // مرگ
  if (res.food < 0 || res.water < 0) {
    const deaths = Math.ceil(state.population * 0.1);
    state.population = Math.max(0, state.population - deaths);
    addLog(`💀 ${deaths} نفر مردند!`, 'bad');
  }
  
  // تولد
  if (res.food > 0 && res.water > 0 && Math.random() < 0.1) {
    state.population++;
    addLog('👶 نوزاد!', 'good');
  }
  
  state.turn++;
  addLog(`— نوبت ${state.turn} —`, 'info');
  renderResources();
}

// شروع بازی
function startGame() {
  const seed = parseInt(document.getElementById('seedInput').value) || Math.floor(Math.random() * 99999);
  document.getElementById('seedInput').value = seed;
  worldSeed = seed;
  
  document.getElementById('seedScreen').classList.add('hidden');
  document.getElementById('uiOverlay').classList.remove('hidden');
  
  initThree();
  
  // ساختمان‌های اولیه
  addBuilding('castle', 0, 0);
  addBuilding('farm', -3, -3);
  addBuilding('well', 3, 3);
  addBuilding('warehouse', -3, 3);
  addBuilding('shelter', 3, -3);
  
  addLog(`🏚️ دنیای جدید با سید ${seed} ایجاد شد!`, 'good');
  renderResources();
  
  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
  animate();
}

// اتصال رویدادها
document.getElementById('endTurn').addEventListener('click', processTurn);
document.getElementById('seedInput').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') startGame();
});

window.addEventListener('resize', () => {
  if (camera) {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }
});
</script>
</body>
</html>
