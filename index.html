<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شبیه‌ساز کلونی پسا-آخرالزمانی</title>
<style>
/* ===== CSS: تم تیره و پیکسلی ===== */
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap');

* { margin:0; padding:0; box-sizing:border-box; }

:root {
  --bg: #0d1117;
  --panel: #161b22;
  --panel2: #1f2630;
  --border: #30363d;
  --text: #e6edf3;
  --muted: #8b949e;
  --green: #3fb950;
  --blue: #58a6ff;
  --red: #f85149;
  --yellow: #d29922;
  --purple: #bc8cff;
}

body {
  font-family: 'Vazirmatn', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  image-rendering: pixelated;
}

#app { max-width: 1100px; margin: 0 auto; padding: 15px; }

/* هدر */
header {
  background: var(--panel);
  border: 2px solid var(--border);
  border-radius: 8px;
  padding: 12px 16px;
  margin-bottom: 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
}
header h1 {
  font-size: 1.3rem;
  color: var(--yellow);
  text-shadow: 0 0 8px rgba(210,153,34,.4);
  letter-spacing: 1px;
}
#turnInfo { color: var(--muted); font-size: .9rem; }
#turnInfo b { color: var(--blue); }

/* داشبورد منابع */
#resources {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px;
  margin-bottom: 15px;
}
.res-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  text-align: center;
  position: relative;
}
.res-card .icon { font-size: 1.6rem; display:block; margin-bottom:4px; }
.res-card .name { font-size:.75rem; color:var(--muted); }
.res-card .value { font-size:1.3rem; font-weight:900; }
.res-card .delta { font-size:.7rem; color:var(--muted); }
.res-card .delta.pos { color: var(--green); }
.res-card .delta.neg { color: var(--red); }

/* چیدمان اصلی */
#mainGrid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}
@media (max-width: 800px) { #mainGrid { grid-template-columns: 1fr; } }

.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
  margin-bottom: 15px;
}
.panel h2 {
  font-size: 1rem;
  color: var(--blue);
  border-bottom: 1px solid var(--border);
  padding-bottom: 8px;
  margin-bottom: 12px;
}

/* جمعیت و مشاغل */
.job-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 0;
  border-bottom: 1px dashed var(--border);
  font-size: .9rem;
}
.job-row .controls button {
  background: var(--panel2);
  border: 1px solid var(--border);
  color: var(--text);
  width: 26px; height: 26px;
  border-radius: 4px;
  cursor: pointer;
  font-weight: 900;
}
.job-row .controls button:hover { background: var(--blue); color:#000; }
.job-row .controls span { display:inline-block; width: 28px; text-align:center; font-weight:700; }

/* جیره */
.ration-btns { display:flex; gap:8px; margin-top:8px; }
.ration-btns button {
  flex:1;
  padding:8px;
  background: var(--panel2);
  border:1px solid var(--border);
  color:var(--text);
  border-radius:6px;
  cursor:pointer;
  font-family:inherit;
}
.ration-btns button.active { border-color: var(--yellow); background: rgba(210,153,34,.15); color:var(--yellow); font-weight:700; }

/* اعزام */
.expedition-form { display:flex; flex-direction:column; gap:8px; }
.expedition-form select, .expedition-form button {
  padding:8px;
  background: var(--panel2);
  border:1px solid var(--border);
  color:var(--text);
  border-radius:6px;
  font-family:inherit;
}
.expedition-form button { background: var(--blue); color:#000; font-weight:700; cursor:pointer; }
.expedition-form button:hover { filter:brightness(1.2); }

/* ساخت و ساز */
.building-item {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px 0;
  border-bottom:1px dashed var(--border);
  font-size:.85rem;
}
.building-item button {
  background: var(--green);
  color:#000;
  border:none;
  padding:5px 10px;
  border-radius:4px;
  cursor:pointer;
  font-family:inherit;
  font-weight:700;
}
.building-item button:disabled { background: var(--muted); cursor:not-allowed; }

/* تحقیق */
.tech-item {
  padding:8px 0;
  border-bottom:1px dashed var(--border);
  font-size:.85rem;
}
.tech-item .row { display:flex; justify-content:space-between; align-items:center; }
.tech-item button {
  background: var(--purple);
  color:#000;
  border:none;
  padding:5px 10px;
  border-radius:4px;
  cursor:pointer;
  font-family:inherit;
  font-weight:700;
}
.tech-item button:disabled { background: var(--muted); cursor:not-allowed; }

/* لاگ */
#logPanel { max-height: 250px; overflow-y:auto; }
.log-entry {
  padding:5px 8px;
  border-bottom:1px solid var(--border);
  font-size:.8rem;
  color:var(--muted);
}
.log-entry.good { color: var(--green); }
.log-entry.bad { color: var(--red); }
.log-entry.info { color: var(--blue); }
.log-entry.warn { color: var(--yellow); }

/* دکمه پایان نوبت */
#endTurn {
  width:100%;
  padding:14px;
  background: var(--green);
  color:#000;
  border:none;
  border-radius:8px;
  font-size:1.1rem;
  font-weight:900;
  cursor:pointer;
  font-family:inherit;
  margin-top:10px;
  box-shadow: 0 0 15px rgba(63,185,80,.3);
}
#endTurn:hover { filter:brightness(1.15); }

/* نوار پیشرفت اعزام */
.exp-progress {
  background: var(--panel2);
  border-radius:4px;
  height:8px;
  margin-top:4px;
  overflow:hidden;
}
.exp-progress .fill {
  height:100%;
  background: var(--blue);
  width:0%;
  transition: width .3s;
}

/* اسکرول‌بار */
::-webkit-scrollbar { width:8px; }
::-webkit-scrollbar-track { background: var(--panel); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius:4px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🏚️ شبیه‌ساز کلونی پسا-آخرالزمانی</h1>
    <div id="turnInfo">نوبت: <b id="turnNum">۱</b> | روز <b id="dayNum">۱</b></div>
  </header>

  <!-- منابع -->
  <div id="resources"></div>

  <div id="mainGrid">
    <!-- ستون راست -->
    <div>
      <div class="panel">
        <h2>👥 جمعیت و مشاغل</h2>
        <div id="jobsList"></div>
        <div style="margin-top:10px; border-top:1px solid var(--border); padding-top:10px;">
          <div style="font-size:.85rem; color:var(--muted); margin-bottom:6px;">جیره‌بندی:</div>
          <div class="ration-btns" id="rationBtns">
            <button data-ration="low">کم</button>
            <button data-ration="normal" class="active">عادی</button>
            <button data-ration="high">زیاد</button>
          </div>
        </div>
      </div>

      <div class="panel">
        <h2>🚀 اعزام (اکسپدیشن)</h2>
        <div class="expedition-form">
          <select id="expType">
            <option value="food">جستجوی غذا</option>
            <option value="water">جستجوی آب</option>
            <option value="scrap">جستجوی ضایعات</option>
            <option value="recruit">جذب بازمانده جدید</option>
          </select>
          <select id="expCount">
            <option value="1">۱ نفر</option>
            <option value="2">۲ نفر</option>
            <option value="3">۳ نفر</option>
          </select>
          <button id="startExp">شروع اعزام</button>
        </div>
        <div id="activeExps" style="margin-top:10px;"></div>
      </div>

      <div class="panel">
        <h2>🏗️ ساخت و ساز</h2>
        <div id="buildingsList"></div>
      </div>
    </div>

    <!-- ستون چپ -->
    <div>
      <div class="panel">
        <h2>🔬 تحقیق و فناوری</h2>
        <div id="techList"></div>
      </div>

      <div class="panel">
        <h2>📜 گزارش رویدادها</h2>
        <div id="logPanel"></div>
      </div>

      <button id="endTurn">⏭️ پایان نوبت</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   شبیه‌ساز کلونی پسا-آخرالزمانی - Vanilla JS
   ============================================================ */

// ---------- تعریف داده‌های پایه ----------
const JOBS = {
  idle:      { name:'بیکار',        icon:'🚶', prod:{} },
  scavenger: { name:'جستجوگر',      icon:'🔍', prod:{ scrap: 2 } },
  farmer:    { name:'کشاورز',       icon:'🌾', prod:{ food: 3 } },
  water:     { name:'آب‌آور',       icon:'💧', prod:{ water: 3 } },
  researcher:{ name:'محقق',         icon:'🔬', prod:{ knowledge: 1 } },
  builder:   { name:'سازنده',       icon:'🔨', prod:{ wood: 1, scrap: 1 } },
  guard:     { name:'نگهبان',       icon:'🛡️', prod:{} }
};

const BUILDINGS = {
  well:      { name:'چاه آب',        icon:'🕳️', cost:{scrap:20, wood:10}, effect:'+۳ آب در نوبت', built:false },
  farm:      { name:'مزرعه',         icon:'🌱', cost:{scrap:15, wood:25}, effect:'+۲ غذا در نوبت', built:false },
  shelter:   { name:'پناهگاه',       icon:'🏠', cost:{scrap:30, wood:40}, effect:'+۵ ظرفیت جمعیت', built:false },
  workshop:  { name:'کارگاه',        icon:'⚙️', cost:{scrap:50, wood:30}, effect:'باز کردن فناوری پیشرفته', built:false },
  radio:     { name:'برج رادیویی',   icon:'📡', cost:{scrap:40, wood:20}, effect:'+۱۰٪ شانس جذب', built:false }
};

// تحقیق‌های بزرگ (Tech Tree)
const BIG_TECHS = {
  weapons: { name:'سلاح‌سازی', icon:'🔫', cost:{scrap:80, knowledge:50}, desc:'باز کردن سطح جدید ساختمان‌ها', done:false },
  medbay:  { name:'اتاق پزشکی', icon:'💊', cost:{scrap:60, knowledge:40}, desc:'کاهش خطر بیماری و مرگ', done:false }
};

// تحقیق‌های تکراری (Upgrades)
const UPGRADES = {
  agri: { name:'بازدهی کشاورزی', icon:'🌾', cost:40, effect:'+۵٪ تولید غذا', level:0, maxLevel:10 },
  waterEff: { name:'بازدهی آب', icon:'💧', cost:40, effect:'+۵٪ تولید آب', level:0, maxLevel:10 },
  scavEff: { name:'بازدهی جستجو', icon:'🔍', cost:50, effect:'+۵٪ تولید ضایعات', level:0, maxLevel:10 }
};

// ---------- وضعیت بازی ----------
let state = {
  turn: 1,
  day: 1,
  resources: { food: 50, water: 50, scrap: 30, wood: 20, knowledge: 5, population: 5 },
  jobs: { idle: 2, scavenger: 1, farmer: 1, water: 1, researcher: 0, builder: 0, guard: 0 },
  ration: 'normal',
  buildings: { well:false, farm:false, shelter:false, workshop:false, radio:false },
  bigTechs: { weapons:false, medbay:false },
  upgrades: { agri:0, waterEff:0, scavEff:0 },
  expeditions: [],
  log: []
};

// ---------- توابع کمکی ----------
function getPop() {
  return Object.values(state.jobs).reduce((a,b)=>a+b,0);
}
function getMaxPop() {
  return 10 + (state.buildings.shelter ? 5 : 0);
}
function getRationMult() {
  if (state.ration === 'low') return 0.5;
  if (state.ration === 'high') return 1.5;
  return 1;
}
function getMorale() {
  if (state.ration === 'low') return 0.8;
  if (state.ration === 'high') return 1.2;
  return 1;
}
function getFoodMult() {
  return 1 + state.upgrades.agri * 0.05;
}
function getWaterMult() {
  return 1 + state.upgrades.waterEff * 0.05;
}
function getScrapMult() {
  return 1 + state.upgrades.scavEff * 0.05;
}

function addLog(msg, type='info') {
  state.log.unshift({ msg, type });
  if (state.log.length > 60) state.log.pop();
}

// ---------- رندر ----------
function renderResources() {
  const res = state.resources;
  const pop = getPop();
  const maxPop = getMaxPop();
  const rationMult = getRationMult();

  // مصرف
  const foodConsume = pop * 1 * rationMult;
  const waterConsume = pop * 1 * rationMult;

  const cards = [
    { icon:'🍞', name:'غذا', value:Math.floor(res.food), delta: -foodConsume },
    { icon:'💧', name:'آب', value:Math.floor(res.water), delta: -waterConsume },
    { icon:'🔩', name:'ضایعات', value:Math.floor(res.scrap), delta: 0 },
    { icon:'🪵', name:'چوب', value:Math.floor(res.wood), delta: 0 },
    { icon:'📚', name:'دانش', value:Math.floor(res.knowledge), delta: 0 },
    { icon:'👥', name:'جمعیت', value:pop, delta: 0, extra:`/${maxPop}` }
  ];

  document.getElementById('resources').innerHTML = cards.map(c => `
    <div class="res-card">
      <span class="icon">${c.icon}</span>
      <div class="name">${c.name}</div>
      <div class="value">${c.value}${c.extra||''}</div>
      <div class="delta ${c.delta>0?'pos':c.delta<0?'neg':''}">${c.delta>0?'+':''}${c.delta!==0?Math.round(c.delta):''}</div>
    </div>
  `).join('');
}

function renderJobs() {
  const pop = getPop();
  const list = document.getElementById('jobsList');
  list.innerHTML = Object.entries(JOBS).map(([key, job]) => {
    const count = state.jobs[key];
    return `
      <div class="job-row">
        <span>${job.icon} ${job.name} <small style="color:var(--muted)">(${count})</small></span>
        <div class="controls">
          <button onclick="changeJob('${key}', -1)" ${count<=0?'disabled':''}>−</button>
          <span>${count}</span>
          <button onclick="changeJob('${key}', 1)" ${pop>=getMaxPop()?'disabled':''}>+</button>
        </div>
      </div>
    `;
  }).join('');

  // جیره
  document.querySelectorAll('#rationBtns button').forEach(b => {
    b.classList.toggle('active', b.dataset.ration === state.ration);
  });
}

function renderBuildings() {
  const list = document.getElementById('buildingsList');
  list.innerHTML = Object.entries(BUILDINGS).map(([key, b]) => {
    const built = state.buildings[key];
    const canAfford = state.resources.scrap >= b.cost.scrap && state.resources.wood >= b.cost.wood;
    return `
      <div class="building-item">
        <div>
          <b>${b.icon} ${b.name}</b><br>
          <small style="color:var(--muted)">${b.effect}</small><br>
          <small style="color:var(--yellow)">🔩${b.cost.scrap} 🪵${b.cost.wood}</small>
        </div>
        <button onclick="buildBuilding('${key}')" ${built?'disabled':!canAfford?'disabled':''}>
          ${built ? '✅ ساخته شد' : 'ساخت'}
        </button>
      </div>
    `;
  }).join('');
}

function renderTech() {
  const list = document.getElementById('techList');

  // تحقیق‌های بزرگ
  const bigHtml = Object.entries(BIG_TECHS).map(([key, t]) => {
    const done = state.bigTechs[key];
    const canAfford = state.resources.scrap >= t.cost.scrap && state.resources.knowledge >= t.cost.knowledge;
    return `
      <div class="tech-item">
        <div class="row">
          <div><b>${t.icon} ${t.name}</b><br><small style="color:var(--muted)">${t.desc}</small></div>
          <button onclick="researchBig('${key}')" ${done?'disabled':!canAfford?'disabled':''}>
            ${done ? '✅' : '🔩'+t.cost.scrap+' 📚'+t.cost.knowledge}
          </button>
        </div>
      </div>
    `;
  }).join('');

  // تحقیق‌های تکراری
  const upHtml = Object.entries(UPGRADES).map(([key, u]) => {
    const canAfford = state.resources.scrap >= u.cost;
    const maxed = u.level >= u.maxLevel;
    return `
      <div class="tech-item">
        <div class="row">
          <div><b>${u.icon} ${u.name}</b> <small style="color:var(--blue)">(سطح ${u.level}/${u.maxLevel})</small><br>
          <small style="color:var(--muted)">${u.effect}</small></div>
          <button onclick="upgrade('${key}')" ${maxed?'disabled':!canAfford?'disabled':''}>
            ${maxed ? 'MAX' : '🔩'+u.cost}
          </button>
        </div>
      </div>
    `;
  }).join('');

  list.innerHTML = `<div style="margin-bottom:8px; color:var(--purple); font-size:.85rem;">— پروژه‌های بزرگ —</div>${bigHtml}
    <div style="margin:12px 0 8px; color:var(--purple); font-size:.85rem;">— ارتقاهای سریع —</div>${upHtml}`;
}

function renderExpeditions() {
  const container = document.getElementById('activeExps');
  if (state.expeditions.length === 0) {
    container.innerHTML = '<small style="color:var(--muted)">هیچ اعزام فعالی نیست.</small>';
    return;
  }
  container.innerHTML = state.expeditions.map((e, i) => {
    const pct = Math.min(100, ((e.total - e.remaining) / e.total) * 100);
    return `
      <div style="margin-bottom:8px; font-size:.8rem;">
        <b>${e.typeName}</b> — ${e.people} نفر | ${e.remaining} نوبت مانده
        <div class="exp-progress"><div class="fill" style="width:${pct}%"></div></div>
      </div>
    `;
  }).join('');
}

function renderLog() {
  document.getElementById('logPanel').innerHTML = state.log.map(l =>
    `<div class="log-entry ${l.type}">${l.msg}</div>`
  ).join('');
}

function renderAll() {
  renderResources();
  renderJobs();
  renderBuildings();
  renderTech();
  renderExpeditions();
  renderLog();
  document.getElementById('turnNum').textContent = state.turn;
  document.getElementById('dayNum').textContent = state.day;
}

// ---------- اکشن‌های بازیکن ----------
function changeJob(job, delta) {
  const pop = getPop();
  const maxPop = getMaxPop();
  if (delta > 0 && pop >= maxPop) { addLog('ظرفیت پناهگاه پر است!', 'warn'); renderAll(); return; }
  if (delta < 0 && state.jobs[job] <= 0) return;

  // برای تغییر شغل، از بیکارها استفاده می‌کنیم
  if (delta > 0) {
    if (state.jobs.idle <= 0) { addLog('بازمانده بیکاری برای این کار نیست!', 'warn'); renderAll(); return; }
    state.jobs.idle--;
    state.jobs[job]++;
  } else {
    state.jobs[job]--;
    state.jobs.idle++;
  }
  renderAll();
}

function setRation(r) {
  state.ration = r;
  addLog(`جیره‌بندی به «${r==='low'?'کم':r==='high'?'زیاد':'عادی'}» تغییر کرد.`, 'info');
  renderAll();
}

function buildBuilding(key) {
  const b = BUILDINGS[key];
  if (state.buildings[key]) return;
  if (state.resources.scrap < b.cost.scrap || state.resources.wood < b.cost.wood) return;
  state.resources.scrap -= b.cost.scrap;
  state.resources.wood -= b.cost.wood;
  state.buildings[key] = true;
  addLog(`✅ ${b.name} ساخته شد! ${b.effect}`, 'good');
  renderAll();
}

function researchBig(key) {
  const t = BIG_TECHS[key];
  if (state.bigTechs[key]) return;
  if (state.resources.scrap < t.cost.scrap || state.resources.knowledge < t.cost.knowledge) return;
  state.resources.scrap -= t.cost.scrap;
  state.resources.knowledge -= t.cost.knowledge;
  state.bigTechs[key] = true;
  addLog(`🔬 تحقیق «${t.name}» کامل شد!`, 'good');
  renderAll();
}

function upgrade(key) {
  const u = UPGRADES[key];
  if (u.level >= u.maxLevel) return;
  if (state.resources.scrap < u.cost) return;
  state.resources.scrap -= u.cost;
  u.level++;
  addLog(`⬆️ ${u.name} به سطح ${u.level} ارتقا یافت.`, 'good');
  renderAll();
}

function startExpedition() {
  const type = document.getElementById('expType').value;
  const count = parseInt(document.getElementById('expCount').value);
  if (state.jobs.idle < count) { addLog('بازمانده بیکار کافی نیست!', 'warn'); return; }

  state.jobs.idle -= count;
  const typeNames = { food:'جستجوی غذا', water:'جستجوی آب', scrap:'جستجوی ضایعات', recruit:'جذب بازمانده' };
  const total = 3 + Math.floor(Math.random()*3); // 3 تا 5 نوبت

  state.expeditions.push({
    type, people: count, total, remaining: total, typeName: typeNames[type]
  });
  addLog(`🚀 اعزام «${typeNames[type]}» با ${count} نفر آغاز شد (${total} نوبت).`, 'info');
  renderAll();
}

// ---------- پردازش نوبت ----------
function processTurn() {
  const res = state.resources;
  const pop = getPop();
  const rationMult = getRationMult();
  const morale = getMorale();

  // ۱) مصرف غذا و آب
  const foodNeed = pop * 1 * rationMult;
  const waterNeed = pop * 1 * rationMult;
  res.food -= foodNeed;
  res.water -= waterNeed;

  // ۲) تولید از مشاغل
  let prodFood = 0, prodWater = 0, prodScrap = 0, prodWood = 0, prodKnow = 0;

  Object.entries(state.jobs).forEach(([job, count]) => {
    const p = JOBS[job].prod;
    if (p.food) prodFood += p.food * count * morale;
    if (p.water) prodWater += p.water * count * morale;
    if (p.scrap) prodScrap += p.scrap * count * morale;
    if (p.wood) prodWood += p.wood * count * morale;
    if (p.knowledge) prodKnow += p.knowledge * count * morale;
  });

  // ضرب‌کننده‌های ارتقا
  prodFood *= getFoodMult();
  prodWater *= getWaterMult();
  prodScrap *= getScrapMult();

  // ۳) تولید ساختمان‌ها
  if (state.buildings.well) prodWater += 3;
  if (state.buildings.farm) prodFood += 2;

  res.food += prodFood;
  res.water += prodWater;
  res.scrap += prodScrap;
  res.wood += prodWood;
  res.knowledge += prodKnow;

  // ۴) رویدادهای مرگ/بیماری
  const deathRisk = (state.ration === 'low' ? 0.15 : 0.03) + (res.water < 0 ? 0.2 : 0);
  if (Math.random() < deathRisk && pop > 1) {
    // یک نفر از بیکارها یا تصادفی می‌میرد
    const jobKeys = Object.keys(state.jobs).filter(k => state.jobs[k] > 0);
    const victim = jobKeys[Math.floor(Math.random()*jobKeys.length)];
    state.jobs[victim]--;
    addLog(`💀 یک بازمانده (${JOBS[victim].name}) بر اثر ${res.water<0?'کم‌آبی':'بیماری'} جان باخت!`, 'bad');
  }

  // ۵) تولد
  const birthChance = (res.food > 0 && res.water > 0 && pop < getMaxPop()) ? 0.12 : 0;
  if (Math.random() < birthChance) {
    state.jobs.idle++;
    addLog('👶 یک نوزاد به دنیا آمد! جمعیت افزایش یافت.', 'good');
  }

  // ۶) پیشرفت اعزام‌ها
  state.expeditions.forEach(e => e.remaining--);
  const finished = state.expeditions.filter(e => e.remaining <= 0);
  state.expeditions = state.expeditions.filter(e => e.remaining > 0);

  finished.forEach(e => {
    const risk = 0.2; // ۲۰٪ خطر
    if (Math.random() < risk) {
      // از دست دادن یک نفر
      state.jobs.idle = Math.max(0, state.jobs.idle - 1);
      addLog(`⚠️ اعزام «${e.typeName}» شکست خورد! یک بازمانده از دست رفت.`, 'bad');
    } else {
      // موفقیت
      let gained = '';
      if (e.type === 'food') { res.food += 15 * e.people; gained = `+${15*e.people} غذا`; }
      else if (e.type === 'water') { res.water += 15 * e.people; gained = `+${15*e.people} آب`; }
      else if (e.type === 'scrap') { res.scrap += 12 * e.people; gained = `+${12*e.people} ضایعات`; }
      else if (e.type === 'recruit') {
        const chance = 0.5 + (state.buildings.radio ? 0.1 : 0);
        if (Math.random() < chance && getPop() < getMaxPop()) {
          state.jobs.idle += e.people;
          gained = `${e.people} بازمانده جدید!`;
        } else {
          gained = 'کسی پیدا نشد';
        }
      }
      addLog(`✅ اعزام «${e.typeName}» موفق بود! ${gained}`, 'good');
    }
  });

  // ۷) بررسی شکست
  if (res.food < -20 || res.water < -20) {
    addLog('☠️ کلونی در آستانه فروپاشی است!', 'bad');
  }

  // ۸) پیشروی زمان
  state.turn++;
  state.day = Math.ceil(state.turn / 3); // هر ۳ نوبت = ۱ روز

  addLog(`— نوبت ${state.turn} آغاز شد —`, 'info');
  renderAll();
}

// ---------- اتصال رویدادها ----------
document.getElementById('endTurn').addEventListener('click', processTurn);
document.getElementById('startExp').addEventListener('click', startExpedition);
document.querySelectorAll('#rationBtns button').forEach(b => {
  b.addEventListener('click', () => setRation(b.dataset.ration));
});

// ---------- شروع بازی ----------
addLog('🏚️ کلونی شما تأسیس شد. ۵ بازمانده آماده‌اند!', 'good');
addLog('💡 نکته: بازمانده‌ها را به مشاغل مختلف بگمارید و منابع را مدیریت کنید.', 'info');
renderAll();
</script>
